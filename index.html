const plot = canvas.parentElement;
const context = canvas.getContext("2d");
const tip = document.querySelector("#tip");
const colors = ["#1689e8", "#2939a0", "#cf5424", "#6924a4"];
const number = new Intl.NumberFormat("en-US");
const percent = new Intl.NumberFormat("en-US", {style:"percent",minimumFractionDigits:1,maximumFractionDigits:1});
const wholePercent = new Intl.NumberFormat('en-US', {style:'percent'});
const packs = [...new Set(rows.map(row => row[1]))].sort((a,b) => a-b);
const dates = [...new Set(rows.map(row => row[0]))].sort();
const ratio = (count, base) => base ? count/base : 0;
const add = (totals, counts) => totals.map((value, index) => value + counts[index]);
let series = [];

pack.add(new Option("All packages", "all"));
for (const item of packs) pack.add(new Option(String(item), item));
pack.value = packs.includes(555) ? "555" : "all";

function draw() {
  if (!series.length) return;
  const width = canvas.clientWidth, height = canvas.clientHeight;
  const scale = window.devicePixelRatio || 1;
  canvas.width = width * scale;
  canvas.height = height * scale;
  context.setTransform(scale,0,0,scale,0,0);
  const compact = window.innerWidth <= 620;
  const left = compact ? 38 : 60, right = compact ? 8 : 20, top = 20, bottom = height - 47;
  const step = (width-left-right)/series.length;
  const max = Math.max(.2, Math.ceil(Math.max(...series.map(d => ratio(d.counts[4],d.counts[0]))) * 10 + .6)/10);
  const y = rate => bottom - rate/max*(bottom-top);
  context.font = (compact ? "10px" : "13px") + " system-ui";
  for (let tick=0; tick<=Math.round(max*10); tick++) {
    const py = y(tick/10);
    context.strokeStyle = "#dce6f1";
    context.beginPath(); context.moveTo(left,py); context.lineTo(width-right,py); context.stroke();
    context.fillStyle = "#50637d"; context.textAlign = "right";
    context.fillText(tick*10 + "%",left-9,py+4);
  }
  const points = [];
  series.forEach(({date,counts}, i) => {
    const [base, early, onDate, after, takeup] = counts;
    const x = left + (i+.5)*step;
    let stacked = 0;
    [early,onDate,after].forEach((count,index) => {
      const value = ratio(count,base);
      const start = y(stacked);
      stacked += value;
      const end = y(stacked);
      context.fillStyle = colors[index];
      context.fillRect(x-step*.36,end,step*.72,start-end);
      if (index === 1 || (start-end >= 24 && step >= 36)) {
        const label = (value*100).toFixed(0)+"%";
        const center = (start+end)/2;
        context.save();
        context.font = (step < 28 ? "9px" : "13px") + " system-ui";
        context.textAlign = "center";
        context.textBaseline = "middle";
        if (index === 1 && start-end < 18) {
          const badgeWidth = Math.min(step - 2, context.measureText(label).width + 6);
          context.fillStyle = colors[1];
          context.fillRect(x-badgeWidth/2,center-8,badgeWidth,16);
        }
        context.fillStyle = "white";
        context.fillText(label,x,center,Math.max(1,step-3));
        context.restore();
      }
    });
    context.fillStyle = "#50637d"; context.textAlign = "center";
    context.fillText(date.slice(-2),x,bottom+22);
    points.push([x,y(ratio(takeup,base)),ratio(takeup,base)]);
  });
  context.strokeStyle = colors[3]; context.lineWidth = 2.5;
  context.beginPath();
  points.forEach(([x,py],i) => i ? context.lineTo(x,py) : context.moveTo(x,py));
  context.stroke();
  context.fillStyle = colors[3];
  context.textAlign = "center";
  points.forEach(([x,py,rate]) => {
    context.beginPath(); context.arc(x,py,3.6,0,2*Math.PI); context.fill();
    if (step >= 36) context.fillText((rate*100).toFixed(0)+"%",x,py-10);
  });
  context.fillStyle = "#50637d";
  context.fillText("October 2026",width/2,height-7);
}

function refresh() {
  const byDate = new Map(dates.map(date => [date,[0,0,0,0,0]]));
  for (const [date, item, ...counts] of rows) {
    if (pack.value === "all" || Number(pack.value) === item)
      byDate.set(date,add(byDate.get(date),counts));
  }
  series = [...byDate].map(([date,counts]) => ({date,counts}));
  const [base,early,onDate,after,takeup] = series.reduce((total,d) => add(total,d.counts),[0,0,0,0,0]);
  const stats = [["Avg. daily expiry base",number.format(Math.round(base / series.length))],["Early renewal",wholePercent.format(ratio(early,base))],
    ["On expiry date",wholePercent.format(ratio(onDate,base))],["After expiry",wholePercent.format(ratio(after,base))],
    ["Takeup rate",wholePercent.format(ratio(takeup,base))]];
  document.querySelector("#metrics").innerHTML = stats.map(([label,value]) =>
    '<div class="card"><span>'+label+'</span><strong>'+value+'</strong></div>').join("");
  tip.hidden = true;
  const buttons = document.querySelector("#days");
  buttons.replaceChildren();
  series.forEach(({date,counts},index) => {
    const [base,...renewals] = counts;
    const metrics = renewals.map(count => number.format(count)+" ("+percent.format(ratio(count,base))+")");
    const label = "Oct " + date.slice(-2);
    const lines = [label, "Base "+number.format(base), ...metrics.map((metric,i) =>
      ["Early ","On expiry ","After expiry ","Takeup "][i]+metric)];
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-label",lines.join(", "));
    const show = () => {
      tip.innerHTML = lines.join("<br>");
      tip.hidden = false;
      tip.style.top = "24px";
      tip.style.left = Math.max(5,Math.min(button.offsetLeft+buttons.offsetLeft,plot.clientWidth-tip.offsetWidth-8))+"px";
    };
    button.addEventListener("mouseenter",show);
    button.addEventListener("focus",show);
    button.addEventListener("click",show);
    for (const event of ["mouseleave","blur"]) button.addEventListener(event,() => {tip.hidden=true;});
    button.addEventListener("keydown",event => {
      if (event.key === "Escape") tip.hidden=true;
      const offset = {"ArrowLeft":-1,"ArrowRight":1}[event.key];
      if (offset) {event.preventDefault(); buttons.children[index+offset]?.focus();}
    });
    buttons.append(button);
  });
  draw();
}
pack.addEventListener("change",refresh);
new ResizeObserver(draw).observe(plot);
refresh();
</script>
</body>
</html>
